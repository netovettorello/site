[build]
  command = "npx @11ty/eleventy"
  publish = "_site"

[images]
  remote_images = ["https://cdn.myportfolio.com/.*"]

[[redirects]]
  from = "/"
  to = "/pt/"
  status = 302
  conditions = {Language = ["pt", "pt-BR", "pt-PT"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

# Fotos e arquivos ficam guardados no navegador do visitante por 7 dias: visitas seguintes abrem mais rápido.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
